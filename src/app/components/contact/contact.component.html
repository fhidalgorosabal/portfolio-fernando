<section id="contacto" class="py-20 bg-gradient-to-br from-cyan-50 to-white dark:from-slate-800 dark:to-slate-900">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Contacto
      </h2>
      <p class="text-xl text-gray-600 dark:text-slate-400">
        ¿Tienes un proyecto en mente? ¡Hablemos!
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
      <!-- Contact Info -->
      <div class="space-y-6">
        <div>
          <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">
            Información de Contacto
          </h3>
          <p class="text-gray-600 dark:text-slate-400 mb-8">
            Estoy disponible para proyectos freelance y oportunidades de trabajo. 
            No dudes en contactarme.
          </p>
        </div>

        <div class="space-y-4">
          <div class="flex items-center space-x-4">
            <div class="w-12 h-12 bg-cyan-600 dark:bg-amber-500 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <div>
              <p class="font-semibold text-gray-900 dark:text-white">Email</p>
              <a href="mailto:contacto@fernando.com" class="text-cyan-600 dark:text-amber-500 hover:underline">
                fhidalgorosabal@gmail.com
              </a>
            </div>
          </div>

          <div class="flex items-center space-x-4">
            <div class="w-12 h-12 bg-cyan-600 dark:bg-amber-500 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
            </div>
            <div>
              <p class="font-semibold text-gray-900 dark:text-white">Teléfono</p>
              <a href="tel:+1234567890" class="text-cyan-600 dark:text-amber-500 hover:underline">
                +55 (54) 98134-2407
              </a>
            </div>
          </div>

          <div class="flex items-center space-x-4">
            <div class="w-12 h-12 bg-cyan-600 dark:bg-amber-500 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <div>
              <p class="font-semibold text-gray-900 dark:text-white">Ubicación</p>
              <p class="text-gray-600 dark:text-slate-400">Itupeva, São Paulo, Brasil</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg p-8">
        <form (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">
              Nombre
            </label>
            <input 
              type="text" 
              id="name" 
              name="name"
              [(ngModel)]="contactForm.name"
              required
              class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-cyan-500 dark:focus:ring-amber-500 focus:border-transparent bg-white dark:bg-slate-700 text-gray-900 dark:text-white"
              placeholder="Tu nombre">
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">
              Email
            </label>
            <input 
              type="email" 
              id="email" 
              name="email"
              [(ngModel)]="contactForm.email"
              required
              class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-cyan-500 dark:focus:ring-amber-500 focus:border-transparent bg-white dark:bg-slate-700 text-gray-900 dark:text-white"
              placeholder="tu@email.com">
          </div>

          <div>
            <label for="message" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">
              Mensaje
            </label>
            <textarea 
              id="message" 
              name="message"
              [(ngModel)]="contactForm.message"
              required
              rows="5"
              class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-cyan-500 dark:focus:ring-amber-500 focus:border-transparent bg-white dark:bg-slate-700 text-gray-900 dark:text-white resize-none"
              placeholder="Tu mensaje..."></textarea>
          </div>

          <button 
            type="submit"
            class="w-full px-6 py-3 bg-cyan-600 dark:bg-amber-500 text-white rounded-lg font-semibold hover:bg-cyan-700 dark:hover:bg-amber-600 transition-colors shadow-lg hover:shadow-xl">
            Enviar Mensaje
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
