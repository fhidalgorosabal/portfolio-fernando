<section id="experiencia" class="py-20 bg-white dark:bg-slate-900">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        Experiencia
      </h2>
      <p class="text-xl text-gray-600 dark:text-slate-400">
        Mi trayectoria profesional
      </p>
    </div>

    <div class="space-y-12">
      @for (exp of experiences; track exp.company) {
        <div class="relative pl-8 pb-12 border-l-2 border-cyan-600 dark:border-amber-500">
          <!-- Timeline dot -->
          <div class="absolute -left-2 top-0 w-4 h-4 rounded-full bg-cyan-600 dark:bg-amber-500"></div>
          
          <div class="bg-gray-50 dark:bg-slate-800 rounded-lg p-6 shadow-md hover:shadow-lg transition-shadow">
            <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-4">
              <div>
                <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">
                  {{ exp.title }}
                </h3>
                <p class="text-xl text-cyan-600 dark:text-amber-500 font-semibold">
                  {{ exp.company }}
                </p>
              </div>
              <span class="text-gray-500 dark:text-slate-400 font-medium mt-2 md:mt-0">
                {{ exp.period }}
              </span>
            </div>

            <ul class="space-y-2 mb-4">
              @for (desc of exp.description; track desc) {
                <li class="text-gray-700 dark:text-slate-300 flex items-start">
                  <span class="text-cyan-600 dark:text-amber-500 mr-2">•</span>
                  <span>{{ desc }}</span>
                </li>
              }
            </ul>

            <div class="flex flex-wrap gap-2 mt-4">
              @for (tech of exp.technologies; track tech) {
                <span class="px-3 py-1 bg-cyan-100 dark:bg-amber-900/30 text-cyan-700 dark:text-amber-400 rounded-full text-sm font-medium">
                  {{ tech }}
                </span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
